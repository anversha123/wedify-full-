services:
  - type: web
    name: wedify-backend
    env: python
    plan: free
    region: ohio
    rootDirectory: backend
    buildCommand: ./build.sh
    startCommand: gunicorn --worker-tmp-dir /dev/shm --log-level debug wedify_project.wsgi:application
    healthCheckPath: /admin/login/ # A safe path that exists

    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".render.com"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: wedify-db
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: PYTHONPATH
        value: .

  - type: static
    name: wedify-frontend
    env: static
    plan: free
    region: ohio
    rootDirectory: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: wedify-backend
          property: host
        # Note: We'll need to append /api to the host manually or in the code
        # Actually, fromService: host gives the URL like https://wedify-backend.onrender.com
        # Vite will see this at build time if we use it correctly.

databases:
  - name: wedify-db
    plan: free
    region: ohio

